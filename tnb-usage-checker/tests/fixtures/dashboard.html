<!DOCTYPE html>
<!-- Trimmed copy of the myTNB "Individual Dashboard" structure, with placeholder data. -->
<html>
<head><title>Individual Dashboard</title></head>
<body>
<div class="account-list">
    <ul id="accountListMobile" class="xlist-group p-0">
            <li id="11111111-1111-4111-8111-111111111111" class="list-group-item accountListItem" style="">
                <div class="row">
                    <div class="col-md-12 col-12">
                        <div class="list-group-item-title">
HOME -
                            123456789012
                        </div>
                    </div>
                </div>
            </li>
            <li id="22222222-2222-4222-8222-222222222222" class="list-group-item accountListItem" style="">
                <div class="row">
                    <div class="col-md-12 col-12">
                        <div class="list-group-item-title">
SHOP -
                            123456789013
                        </div>
                    </div>
                </div>
            </li>
            <li id="33333333-3333-4333-8333-333333333333" class="list-group-item accountListItem" style="">
                <div class="row">
                    <div class="col-md-12 col-12">
                        <div class="list-group-item-title">
PARENTS -
                            123456789014
                        </div>
                    </div>
                </div>
            </li>
    </ul>
</div>
<div class="row mobile-view">
    <div class="col-md col-12 text-center ">
        <div class="row default-spacing-24 ">
            <div class="col-md col-12 ">
                    <span class="card-text-20-14 darken">$headline</span>
            </div>
        </div>
        <div class="row  ">
            <div class="col-md col-12 ">
                    <span class="card-title-inverse-light">RM</span>
                    <span class="card-text-48-24-black">$amount</span>
            </div>
        </div>
        <div class="row  default-spacing-24 mt-1">
            <div class="col-md col-12 ">
                    <span class="card-title-inverse-lighterX" style="color: #49494a; font-size: 16px;">$due</span>
            </div>
        </div>
    </div>
</div>
<div class="row dashboard-billing-summary">
    <div class="col-md-6  ">
        <div class="row text-center default-spacing-24">
            <div class="col-md ">
                <span class="card-text-20-14 darken">Billing Summary</span>
            </div>
        </div>
        <div class="row dashboard-spacing-p">
            <div class="col-md  col-6"><label class="card-text-16-12">My Current Charges</label></div>
            <div class="col-md  col-6 mobile-right-alignment"><label class="card-text-16-12"> RM 99.99</label></div>
        </div>
    </div>
    <div class="col-md divider-left desktop-view">
        <div class="row text-center default-spacing-24x mb-2">
            <div class="col-md text-center">
                    <span class="card-text-20-14 darken">$headline</span>
            </div>
        </div>
        <div class="row mb-1 ">
            <div class="col-md text-center">
                    <span class="card-title-inverse-light">RM</span>
                    <span class="card-text-48-24-black">$amount</span>
            </div>
        </div>
    </div>
</div>
<span class="card-text-20-14 darken">Payment History</span>
<script>
    $$("#modalSubmitSMR .modal-dialog").load('/AccountManagement/IndividualDashboard/GetSubmitSMRView?selectedAccountNo=$selected&page=Individual_MyDashboard');
</script>
</body>
</html>
