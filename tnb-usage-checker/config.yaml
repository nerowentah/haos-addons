name: "TNB Usage Checker"
version: "0.5.4"
slug: "power_tnb"
description: >-
  Tracks Malaysian TNB electricity for multiple accounts: imports hourly
  myTNB smart meter usage and cost into the Energy dashboard and estimates
  the running bill (2025 tariff, ToU, AFA, EEI, SST, KWTBB, NEM) from a local
  energy sensor, published as MQTT devices when a broker is available.
url: "https://github.com/nerowentah/haos-addons/tree/main/tnb-usage-checker"
image: "ghcr.io/nerowentah/power-tnb"
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:lightning-bolt
panel_title: TNB Usage
homeassistant_api: true
hassio_api: true
services:
  - mqtt:want
options:
  portal_interval_hours: 6
  meter_poll_seconds: 60
  afa_rate: 0.0
  calendarific_api_key: ""
  extra_holidays: []
  notify_on_failure: true
  notify_on_unpaid: true
  mqtt: true
  daily_report: true
  maintenance_windows:
    - "daily 00:00-06:00"
  debug_login: false
  mytnb_username: ""
  mytnb_password: ""
  accounts:
    - name: "Home"
      account_number: ""
      tariff: "general"
      billing_start_day: 1
  log_level: info
schema:
  portal_interval_hours: int(1,168)
  meter_poll_seconds: int(10,600)
  afa_rate: float(-1,1)
  calendarific_api_key: password?
  extra_holidays:
    - match(^\d{4}-\d{2}-\d{2}$)
  notify_on_failure: bool
  notify_on_unpaid: bool?
  mqtt: bool
  daily_report: bool?
  maintenance_windows:
    - str
  debug_login: bool?
  mytnb_username: str?
  mytnb_password: password?
  accounts:
    - name: str
      account_number: match(^(\d{10,14})?$)?
      tariff: list(general|tou)
      billing_start_day: int(1,31)
      mytnb_username: email?
      mytnb_password: password?
      smartmeter_url: password?
      import_entity: str?
      export_entity: str?
      enabled: bool?
      portal_enabled: bool?
      meter_enabled: bool?
      statistics_enabled: bool?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
