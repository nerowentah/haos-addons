configuration:
  log_level:
    name: Log level
    description: How much the app writes to its log - trace, debug, info (default), notice, warning, error or fatal. Use debug while troubleshooting, then set it back to info. Applies without a restart.
  portal_interval_hours:
    name: myTNB sync interval (hours)
    description: How often to log in to myTNB and import smart meter data. TNB publishes data about two days late, so every few hours is plenty (1-168, up to 7 days).
  meter_poll_seconds:
    name: Energy sensor poll interval (seconds)
    description: How often to read each account's local energy sensor for the live bill estimate.
  afa_rate:
    name: AFA rate (RM/kWh)
    description: Current Automatic Fuel Adjustment announced monthly by TNB/ST, e.g. -0.0047 for a 0.47 sen rebate. Applies only to usage above 600 kWh.
  calendarific_api_key:
    name: Calendarific API key (optional)
    description: Free key from calendarific.com to load lunar public holidays (Hari Raya, CNY, Deepavali...) as ToU off-peak days. Fixed-date holidays are built in.
  extra_holidays:
    name: Extra off-peak holidays
    description: Additional YYYY-MM-DD dates treated as ToU off-peak all day.
  notify_on_failure:
    name: Notify on sync failure
    description: Push a notification when a myTNB sync fails (and again when it recovers). Phones are found automatically; switch individual phones on or off in the TNB Usage panel.
  notify_on_unpaid:
    name: Notify on unpaid bill
    description: Push a notification when myTNB shows a new amount due, a reminder once a week while it stays unpaid, and one when it is paid. Also a switch in the TNB Usage panel.
  mqtt:
    name: Use MQTT when available
    description: Publish one MQTT device per account when a broker (e.g. the Mosquitto broker app) is found; it is detected automatically while the app runs. Off, or without a broker, entities are created through the Home Assistant states API instead.
  maintenance_windows:
    name: myTNB maintenance windows
    description: "Times (Malaysia time) when the app never calls myTNB, because TNB does system maintenance then. One per line, e.g. daily 00:00-06:00, sun 01:00-05:00, mon-fri 23:00-02:00. A sync due inside a window waits until it ends. Leave the list empty to sync at any time; maintenance pages are still detected and backed off."
  daily_report:
    name: Daily usage report
    description: Once a day, when myTNB publishes a new complete day, notify the phones with that day's kWh and RM, the change from the day before, and the billing cycle so far. Also a switch in the TNB Usage panel.
  debug_login:
    name: Verbose login log
    description: Log every myTNB login step (redirects, HTTP status, cookie and form field names, page titles) to debug login and meter errors. Passwords, cookie values and account numbers are never logged. Also a switch in the TNB Usage panel. log_level debug shows the same trace.
  mytnb_username:
    name: myTNB email (shared)
    description: The email you log in to myTNB with. Used by every account below that has an account number, so one login covers all your TNB accounts. Needs a smart meter (AMI).
  mytnb_password:
    name: myTNB password (shared)
    description: Your myTNB password. Masked in the UI and never logged.
  accounts:
    name: TNB accounts
    description: One entry per electricity account. Each needs an account number (with the myTNB login above), a local energy sensor, or both.
    fields:
      name:
        name: Account name
        description: Friendly name; also used for the device and entity ids (e.g. "Home" gives sensor.tnb_home_bill_estimate).
      account_number:
        name: TNB account number
        description: The 12-digit account number printed on your TNB bill (also in the myTNB app under the account). Enables myTNB smart meter sync with the shared login.
      tariff:
        name: Tariff
        description: general (flat rate) or tou (Time-of-Use, peak weekdays 14:00-22:00).
      billing_start_day:
        name: Billing cycle start day
        description: Day of the month your TNB bill cycle starts (see your bill's reading date).
      mytnb_username:
        name: Different myTNB email (optional)
        description: Only for an account that belongs to another myTNB login; otherwise leave empty and the shared login above is used.
      mytnb_password:
        name: Different myTNB password (optional)
        description: Password for the different login above. Masked in the UI and never logged.
      smartmeter_url:
        name: Smart meter URL (legacy, optional)
        description: The address of View Energy Usage for this account on the myTNB website. Only needed if sync reports meter_error; when set, it is used instead of account_number.
      import_entity:
        name: Grid import energy sensor (optional)
        description: Cumulative kWh/Wh sensor of energy drawn from TNB (e.g. a Shelly EM channel) for the live bill estimate.
      export_entity:
        name: Grid export energy sensor (optional)
        description: Cumulative kWh/Wh sensor of solar energy exported to TNB, credited NEM-style.
      enabled:
        name: Account enabled
        description: Switch off to pause everything for this account (entities show as unavailable). Also switchable from the TNB Usage panel; applies without a restart.
      portal_enabled:
        name: myTNB sync
        description: Log in to myTNB and fetch smart meter data. Off keeps the credentials but stops syncing.
      meter_enabled:
        name: Live bill estimate
        description: Read the energy sensors for the live bill estimate.
      statistics_enabled:
        name: Energy dashboard import
        description: Import myTNB hourly usage and cost as long-term statistics.
