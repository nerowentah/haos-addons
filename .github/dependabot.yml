version: 2

# Scheduled inside one window per day (see `time`/`timezone`) so the bot wave is
# predictable instead of landing at whatever hour Dependabot picks.
# `rebase-strategy: disabled` everywhere: with `auto`, every push to main
# rebases each open bot PR and re-runs its multi-arch image build.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "03:00"
      timezone: "Asia/Kuala_Lumpur"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    assignees:
      - "nerowentah"
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(ci):"
    cooldown:
      default-days: 7
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # One entry for every app folder (each image is still built from its own
  # folder). group-by emits one PR per base image across all of them, so a
  # shared base-image bump is reviewed once instead of eight times.
  - package-ecosystem: "docker"
    directories:
      - "/api-key-manager"
      - "/cloudflare-tunnel"
      - "/lg-webos-devmode-mgmt"
      - "/mobile-device-manager"
      - "/ranhill-saj-bill-checker"
      - "/ssl-cert-manager"
      - "/storage-optimizer"
      - "/tnb-usage-checker"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "03:10"
      timezone: "Asia/Kuala_Lumpur"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
    assignees:
      - "nerowentah"
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(docker):"
    cooldown:
      default-days: 7
    groups:
      docker-images:
        applies-to: version-updates
        group-by: dependency-name
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # requirements-dev.txt: only the tools move. The libraries mirror the
  # versions of the Alpine packages in the images and change with the base image.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "03:20"
      timezone: "Asia/Kuala_Lumpur"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "python"
    assignees:
      - "nerowentah"
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(deps):"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "paho-mqtt"
      - dependency-name: "websocket-client"
      - dependency-name: "cryptography"
      - dependency-name: "pyyaml"
    groups:
      python-deps:
        applies-to: version-updates
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-dev-deps:
        applies-to: version-updates
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
