name: Probe packages API

# Round 3: version-level DELETE + RESTORE with GITHUB_TOKEN, on an orphan
# package this task exists to delete anyway. Net effect of the pair: none.

on:
  pull_request:
    paths:
      - .github/workflows/probe-packages-api.yaml

permissions:
  contents: read
  packages: write

jobs:
  probe:
    name: Probe
    if: github.repository == 'nerowentah/haos-addons'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Round 3 - version delete and restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg=amd64-malaysia-utility-bills
          echo "=== before ==="
          gh api "/user/packages/container/${pkg}" | jq -c '{name, version_count}'
          vid=$(gh api "/user/packages/container/${pkg}/versions?per_page=100" | jq -r '.[0].id')
          echo "=== DELETE version ${vid} ==="
          if gh api --silent --method DELETE "/user/packages/container/${pkg}/versions/${vid}"; then
            echo "VERSION DELETE: SUCCESS"
          else
            echo "VERSION DELETE: FAILED"
          fi
          echo "=== after delete ==="
          gh api "/user/packages/container/${pkg}" | jq -c '{name, version_count}'
          echo "=== RESTORE version ${vid} ==="
          if gh api --silent --method POST "/user/packages/container/${pkg}/versions/${vid}/restore"; then
            echo "VERSION RESTORE: SUCCESS"
          else
            echo "VERSION RESTORE: FAILED"
          fi
          echo "=== after restore ==="
          gh api "/user/packages/container/${pkg}" | jq -c '{name, version_count}'
          echo "=== active versions with tags ==="
          gh api "/user/packages/container/${pkg}/versions?per_page=100&state=active" | jq -c '[.[] | {id, tags: (.metadata.container.tags // [])}]'
