name: PR Auto-Update

# Serial PR queue: see nerowentah/scripts shared-pr-auto-update.yml. `push`
# shortens the wait after a manual merge; the schedule picks up GITHUB_TOKEN
# auto-merges, which fire no push.
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  # GITHUB_TOKEN auto-merges fire no push and no PR `closed`, so serve the next
  # PR when the front PR's CI completes (the queue waits briefly for the merge).
  # zizmor: ignore[dangerous-triggers] - runs default-branch code only, checks
  # out nothing and reads no artifacts: it only calls gh with this repo's token.
  workflow_run:
    workflows: [Code Quality, Builder, CodeQL]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  queue:
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
    uses: ./.github/workflows/shared-pr-auto-update.yml
    with:
      dispatch-workflows: code-quality.yml builder.yaml codeql.yml
