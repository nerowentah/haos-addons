name: Stale Issue Manager

on:
  schedule:
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/shared-stale.yml
    with:
      labels-linux: '["ubuntu-latest"]'
      days-before-stale: 60
      days-before-close: 7
