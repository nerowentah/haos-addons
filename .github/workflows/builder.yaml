name: Builder

# PRs and PR-queue dispatches build without publishing (`builder`; its
# "builder / Initialize builds" check is required). A push to main builds and
# publishes (`publish`). Both grant packages/id-token write because
# build-app.yaml declares them, but only `publish` passes publish: true; fork PRs
# get a read-only token from GitHub regardless. retry-signing.yaml and
# scan-images.yaml follow this workflow by name.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes and PR-branch dispatches are cancelled; a publishing
  # push to main never is.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  queue:
    if: github.event_name != 'push'
    permissions:
      contents: read
      pull-requests: read
    uses: nerowentah/scripts/.github/workflows/shared-pr-queue.yml@9bf3624e56d8e03a782eb9db55b35d5d184f510a # v1.0.0
    with:
      dispatch-workflows: code-quality.yml builder.yaml codeql.yml

  builder:
    needs: queue
    # Not deferred by the PR queue. Fork PRs build too (hosted runners, read-only
    # token), as before; the queue never defers them.
    if: needs.queue.outputs.defer != 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/builder-jobs.yaml
    with:
      publish: false

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/builder-jobs.yaml
    with:
      publish: true
