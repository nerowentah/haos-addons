name: Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  find:
    name: Find apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.addons_list }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find app directories
        id: apps
        uses: home-assistant/actions/helpers/find-addons@86d4564712fa02543c808e3a693dd04f9d3f8361 # master, 2026-10-26

  app-config:
    name: App config ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.find.outputs.apps) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the app configuration
        uses: frenck/action-app-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: "./${{ matrix.app }}"

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The Python the images run (Alpine 3.24). Ruff still targets py313
          # (pyproject.toml), the oldest syntax the code is written for.
          python-version: "3.14"

      - name: Install linters and test dependencies
        # Exact versions: the tools, and the libraries as Alpine 3.24 ships them.
        run: pip install -r requirements-dev.txt

      - name: Supervisor schema syntax
        run: python .github/scripts/check_schema.py

      - name: Shared modules are in sync
        run: python tools/sync_shared.py --check

      - name: Type check (strict) the shared modules
        # Each app is checked on its own (same module names in every app);
        # apps join this list as they become strict-clean.
        env:
          MYPYPATH: shared/app:shared/tests/stubs:tools
        run: mypy shared/app shared/tests tools

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Unit tests
        run: |
          set -e
          # Every app, and shared/ (the modules every app ships a copy of).
          for app in */; do
            app=${app%/}
            [ -d "$app/tests" ] || continue
            echo "::group::$app"
            python -m unittest discover -s "$app/tests"
            echo "::endgroup::"
          done

  s6-layout:
    name: s6 layout
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No deprecated s6-rc.d/user bundle
        run: |
          if git ls-files | grep -q 'rootfs/etc/s6-overlay/s6-rc.d/user/'; then
            echo "::error::Register services in rootfs/etc/s6-overlay/user-bundles.d/user/contents.d/, not s6-rc.d/user/"
            git ls-files | grep 'rootfs/etc/s6-overlay/s6-rc.d/user/'
            exit 1
          fi

      - name: Every app registers its service in the user bundle
        run: |
          for dir in */; do
            app=${dir%/}
            [ -f "$app/config.yaml" ] || continue
            test -f "$app/rootfs/etc/s6-overlay/user-bundles.d/user/contents.d/$app" || {
              echo "::error::$app does not register its service in rootfs/etc/s6-overlay/user-bundles.d/user/contents.d/"
              exit 1
            }
          done
