name: Shared PR Queue Gate

# Decides whether a CI run should defer to the PR queue (shared-pr-auto-update.yml,
# called from each repo's pr-auto-update.yml).
#
# The default-branch ruleset requires strict (up-to-date) checks, so a PR's CI
# only counts if it ran on a branch that already contains the latest base. Any
# run on a PR that is not at the front of the queue is thrown away as soon as
# the front PR merges, and on a single self-hosted runner it also delays the
# front PR. This gate skips those runs.
#
# A PR is "queued" when it is open, non-draft, same-repo and either has
# auto-merge enabled or was opened by the repository owner (who merges by hand).
# This is the same candidate set shared-pr-auto-update.yml serves - the rule is
# kept identical in both files and checked by check-workflows.mjs - so every
# deferred PR is one the queue will later update and run CI for. Only PRs into
# the queue's base branch are deferred: the queue serves no other branch.
#
# Strict order: PRs are approved (merged) in number order, so only the OLDEST
# open queued PR ever runs CI. Any older queued PR blocks this one until it is
# merged or closed - whether its CI is running, never ran, or it is green and
# waiting for a manual merge. A front PR that cannot merge as it stands (merge
# conflicts, failed checks, a workflow-file update the token may not make) is
# labeled queue-blocked by shared-pr-auto-update.yml and leaves the line, like a
# failing PR in GitHub's merge queue. A draft leaves it too. QUEUE-FRONT:
# shared-pr-auto-update.yml serves exactly this PR and never skips past it.
#
# defer=true when this PR is queued and either
#   - an older queued PR is open, or
#   - this PR is behind the base (the run could never satisfy the strict rule;
#     the queue merges the base into it first, then runs CI once).
# This applies to pull_request runs AND to workflow_dispatch runs on a PR
# branch, so a hand-dispatched run cannot jump the queue and auto-merge ahead
# of an older PR. Dispatches made by the queue itself (github-actions[bot]) are
# never deferred: the queue only dispatches for the PR it picked.
# A pull_request `closed` run always defers: it exists only so the workflow's
# concurrency group cancels the closed PR's in-progress CI, which would
# otherwise hold the self-hosted runner after the PR merged.
# Non-queued PRs (drafts, forks, Dependabot majors without auto-merge) always run.
# So do PRs labeled queue-blocked: shared-pr-auto-update.yml took them out of the
# line because they could not merge (merge conflicts, failed checks on an
# up-to-date head, or a workflow-file update GITHUB_TOKEN may not make), and a
# fix pushed to one must get CI at once. It rejoins in number order when its
# head changes or the reason clears.
#
# Callers skip the job that produces the required checks on defer=true. A
# skipped *reusable-workflow caller* job never creates the nested check names
# ("shared-ci / lint", ...), so the PR shows them as expected and cannot merge
# until the queue dispatches the real run. Never defer by skipping a plain job
# that carries a required check name: a skipped check counts as passed.
#
# Fails open: any API error yields defer=false. A wrong "run" only costs a CI
# run; a wrong "defer" would leave a PR without checks.

on:
  workflow_call:
    inputs:
      dispatch-workflows:
        type: string
        required: false
        default: code-quality.yml
        description: Space-separated workflows the queue dispatches (kept for caller compatibility).
    outputs:
      defer:
        description: "'true' when this run's CI should be left to the PR queue"
        value: ${{ jobs.gate.outputs.defer }}

permissions:
  contents: read

jobs:
  gate:
    # Hosted, no checkout: gh and jq only, and it must not wait for (or hold)
    # the self-hosted runner it is trying to save.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # compare API (behind_by)
      pull-requests: read # gh pr list
    outputs:
      defer: ${{ steps.gate.outputs.defer }}
    steps:
      - name: Harden Runner
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check the PR queue
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          QUEUE_BASE: ${{ github.event.repository.default_branch || 'main' }}
          # Set by shared-pr-auto-update.yml on a front PR that cannot merge as
          # it stands (conflicts, failed checks, an update the token may not make).
          BLOCK_LABEL: queue-blocked
        run: |
          set -euo pipefail
          defer=false
          reason=""

          finish() {
            echo "defer=$defer" >> "$GITHUB_OUTPUT"
            if [ "$defer" = true ]; then
              echo "Deferred: $reason"
              {
                echo "### CI deferred"
                echo
                echo "$reason. The PR queue (pr-auto-update.yml) brings this branch up to"
                echo "date with \`$QUEUE_BASE\` and runs CI when it reaches the front. Running"
                echo "CI by hand would only be thrown away when the PR ahead merges."
                echo
                echo "To nudge the queue now: \`gh workflow run pr-auto-update.yml\`"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Not deferred${reason:+: $reason}."
            fi
            exit 0
          }

          case "$EVENT_NAME" in
            pull_request)
              if [ "$ACTION" = closed ]; then
                defer=true
                reason="PR #$PR_NUMBER is closed; this run only cancels its in-progress CI"
                finish
              fi
              head_sha="$PR_HEAD_SHA"
              if [ "$PR_BASE_REF" != "$QUEUE_BASE" ]; then
                reason="PR targets $PR_BASE_REF; the queue only serves $QUEUE_BASE"
                finish
              fi
              ;;
            workflow_dispatch)
              if [ "$TRIGGERING_ACTOR" = "github-actions[bot]" ]; then
                reason="dispatched by the PR queue"
                finish
              fi
              if [ "$REF_NAME" = "$QUEUE_BASE" ]; then
                reason="dispatch on $QUEUE_BASE"
                finish
              fi
              if ! PR_NUMBER=$(gh pr list --repo "$REPO" --base "$QUEUE_BASE" --head "$REF_NAME" \
                --state open --json number --jq '.[0].number // empty'); then
                echo "::warning::Could not look up the PR for $REF_NAME; running CI."
                finish
              fi
              if [ -z "$PR_NUMBER" ]; then
                reason="$REF_NAME has no open PR into $QUEUE_BASE"
                finish
              fi
              head_sha="$DISPATCH_SHA"
              ;;
            *)
              reason="$EVENT_NAME runs are never deferred"
              finish
              ;;
          esac

          if ! prs=$(gh pr list --repo "$REPO" --base "$QUEUE_BASE" --state open --limit 100 \
            --json number,isDraft,isCrossRepository,autoMergeRequest,author,mergeStateStatus,labels); then
            echo "::warning::Could not list open PRs; running CI."
            finish
          fi

          # Queued PRs, oldest first. QUEUE-RULE: this select() line must stay
          # identical to the one in shared-pr-auto-update.yml (check-workflows.mjs).
          queued=$(jq -c --arg owner "$OWNER" --arg l "$BLOCK_LABEL" '[.[]
            | select((.isDraft | not) and (.isCrossRepository | not) and ([.labels[].name] | index($l) | not) and (.autoMergeRequest != null or .author.login == $owner))]
            | sort_by(.number)' <<<"$prs")

          if [ "$(jq --argjson n "$PR_NUMBER" 'map(.number) | index($n) == null' <<<"$queued")" = true ]; then
            reason="PR #$PR_NUMBER is not in the queue (draft, fork, $BLOCK_LABEL, or neither auto-merge nor owner-authored)"
            finish
          fi

          # QUEUE-FRONT: strict order - any older open queued PR blocks.
          older=$(jq -r --argjson n "$PR_NUMBER" '[.[] | select(.number < $n)] | first
            | if . == null then empty
              elif .mergeStateStatus == "DIRTY" then "#\(.number) (merge conflicts: resolve them, or convert it to draft)"
              else "#\(.number)" end' <<<"$queued")
          if [ -n "$older" ]; then
            defer=true
            reason="PR $older is ahead of #$PR_NUMBER in the PR queue and is not merged yet"
            finish
          fi

          behind_by() {
            gh api "repos/$REPO/compare/$QUEUE_BASE...$1" --jq '.behind_by'
          }

          if ! behind=$(behind_by "$head_sha"); then
            echo "::warning::Could not compare $head_sha with $QUEUE_BASE; running CI."
            finish
          fi
          if [ "$behind" -gt 0 ]; then
            defer=true
            reason="PR #$PR_NUMBER is $behind commit(s) behind $QUEUE_BASE"
            finish
          fi

          reason="PR #$PR_NUMBER is first in the queue and up to date with $QUEUE_BASE"
          finish
