name: Dependabot Auto-Approval

# opened/reopened only: the approval and auto-merge persist across pushes (the
# ruleset does not dismiss stale reviews).
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] - required so dependabot PRs get a write GITHUB_TOKEN; no PR-controlled code is checked out or executed and shared-auto-approve.yml gates every job on the PR author + same-repo head
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  auto-approve:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/shared-auto-approve.yml
    with:
      labels-linux: '["ubuntu-latest"]'
      major-delay-days: -1
