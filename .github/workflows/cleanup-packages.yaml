name: Cleanup ghcr packages

# Keeps ghcr.io/nerowentah tidy after apps are removed or change shape:
#
# - deletes container packages that are linked to this repository but no
#   longer belong to any app here (its folder, image or an arch is gone);
# - prunes versions of live packages that carry no tags at all (superseded
#   re-pushes of the same tag) once they are older than 30 days. Tagged
#   versions - releases, latest and the cosign sha256-* signature tags - are
#   always kept, so pinned installs and signature verification keep working.
#
# How packages are found: the packages REST API cannot list packages for the
# GITHUB_TOKEN this workflow runs with (GitHub App installation tokens are
# rejected by the listing endpoints), but fetching a package, listing its
# versions and deleting it by name all work. So discovery runs the other way
# around: the candidate names come from this repository itself - every image
# name that any config.yaml has ever named in the history of this branch,
# plus the names the current apps expect - and each candidate is looked up
# directly. A package that no config.yaml in this repository's history ever
# named is never considered, and only packages whose repository link is
# exactly this repository are ever deleted.
#
# Deletions can be undone for 30 days (package settings -> Deleted Packages,
# or the versions restore API).
#
# The weekly run deletes for real; manual runs default to a dry run.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only log what would be deleted
        type: boolean
        default: true
      prune-untagged:
        description: Also delete untagged versions of live packages older than 30 days
        type: boolean
        default: true
  schedule:
    # Weekly, off the hour to stay clear of GitHub's busiest minutes.
    - cron: "23 3 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: cleanup-packages
  cancel-in-progress: false

env:
  # GITHUB_TOKEN can fetch and delete the packages this repository published:
  # publishing grants the repository the admin role on them. GHCR_CLEANUP_TOKEN
  # is an optional escape hatch - a classic PAT with read:packages and
  # delete:packages, used instead of GITHUB_TOKEN when set. Such a token also
  # sees packages beyond this repository; the repository link check below
  # keeps those out of scope.
  GH_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN || github.token }}
  REPO: ${{ github.repository }}
  # The scheduled run deletes for real and prunes; manual runs follow the inputs.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
  PRUNE_UNTAGGED: ${{ github.event_name == 'schedule' || inputs.prune-untagged }}

jobs:
  cleanup:
    name: Cleanup packages
    if: github.repository == 'nerowentah/haos-addons'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        # Full history: the candidate package names are read from it.
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find app directories
        id: apps
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Compute the package names this repository should have
        id: expected
        env:
          APPS: ${{ steps.apps.outputs.addons }}
        run: |
          names=()
          for app in ${APPS}; do
            cfg="${app}/config.yaml"
            image=$(sed -n 's/^image:[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' "${cfg}")
            if [[ -z "${image}" ]]; then
              echo "::error file=${cfg}::Cannot read the image: entry. Aborting so that no live package is treated as orphaned."
              exit 1
            fi
            name=${image##*/}
            # Every arch an app builds for gets its own per-arch package.
            archs=$(awk '/^arch:/{f=1; next} f && /^[[:space:]]*-[[:space:]]*[^[:space:]]/{sub(/^[[:space:]]*-[[:space:]]*/, ""); gsub(/[[:space:]]/, ""); print; next} f && /^[^[:space:]]/{f=0}' "${cfg}")
            if [[ -z "${archs}" ]]; then
              echo "::error file=${cfg}::Cannot read the arch: list. Aborting so that no live package is treated as orphaned."
              exit 1
            fi
            names+=("${name}")
            while read -r arch; do
              names+=("${arch}-${name}")
            done <<< "${archs}"
          done
          if [[ ${#names[@]} -eq 0 ]]; then
            echo "::error::No apps found; refusing to treat every package as orphaned."
            exit 1
          fi
          mapfile -t unique < <(printf '%s\n' "${names[@]}" | sort -u)
          echo "names=$(jq -nc '$ARGS.positional' --args "${unique[@]}")" >> "$GITHUB_OUTPUT"

      - name: Collect every package name this repository ever had
        id: candidates
        env:
          APPS: ${{ steps.apps.outputs.addons }}
          EXPECTED: ${{ steps.expected.outputs.names }}
        run: |
          # One line per config.yaml blob ever committed to this branch.
          git rev-list --objects HEAD \
            | awk '$2 ~ /^[^/]+\/config\.yaml$/ {print $1}' | sort -u > blobs.txt
          # Guard the history scan: every current app's config.yaml must be
          # reachable, otherwise the candidate list is broken and the run
          # must stop rather than miss orphaned packages silently.
          for app in ${APPS}; do
            sha=$(git ls-tree HEAD "${app}/config.yaml" | awk '{print $3}')
            if [[ -z "${sha}" ]] || ! grep -qx "${sha}" blobs.txt; then
              echo "::error file=${app}/config.yaml::Not reachable in history; refusing to work with an incomplete candidate list."
              exit 1
            fi
          done
          names=()
          while read -r blob; do
            cfg=$(git cat-file blob "${blob}")
            image=$(sed -n 's/^image:[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' <<< "${cfg}")
            # A historical config.yaml with no parsable image: line has no
            # package name to contribute; the apps it built are covered by
            # whichever of its later revisions named an image.
            [[ -n "${image}" ]] || continue
            name=${image##*/}
            names+=("${name}")
            while read -r arch; do
              names+=("${arch}-${name}")
            done < <(awk '/^arch:/{f=1; next} f && /^[[:space:]]*-[[:space:]]*[^[:space:]]/{sub(/^[[:space:]]*-[[:space:]]*/, ""); gsub(/[[:space:]]/, ""); print; next} f && /^[^[:space:]]/{f=0}' <<< "${cfg}")
          done < blobs.txt
          # The current expected names join the candidates so that the live
          # packages are probed as well.
          while read -r name; do
            names+=("${name}")
          done <<< "$(jq -r '.[]' <<< "${EXPECTED}")"
          mapfile -t unique < <(printf '%s\n' "${names[@]}" | sort -u)
          if [[ ${#unique[@]} -eq 0 ]]; then
            echo "::error::No candidate package names found; refusing to continue."
            exit 1
          fi
          echo "names=$(jq -nc '$ARGS.positional' --args "${unique[@]}")" >> "$GITHUB_OUTPUT"

      - name: Look up the candidate packages
        env:
          CANDIDATES: ${{ steps.candidates.outputs.names }}
        run: |
          # A package that does not come back for its name either does not
          # exist or is not visible to this token; either way it is not this
          # repository's business.
          : > found.jsonl
          for name in $(jq -r '.[]' <<< "${CANDIDATES}"); do
            encoded=$(jq -rn --arg n "${name}" '$n | @uri')
            resp=$(gh api "/user/packages/container/${encoded}" 2>&1) || true
            if jq -e . >/dev/null 2>&1 <<< "${resp}"; then
              jq -c '{name, version_count, html_url, repository: .repository.full_name}' <<< "${resp}" >> found.jsonl
            else
              echo "  ${name}: ${resp}"
            fi
          done
          jq -s . found.jsonl > packages.json
          echo "Probed $(jq 'length' <<< "${CANDIDATES}") name(s) from this repository's history; found $(jq 'length' packages.json) container package(s)."

      - name: Find the orphaned packages
        env:
          EXPECTED: ${{ steps.expected.outputs.names }}
          CANDIDATES: ${{ steps.candidates.outputs.names }}
        run: |
          jq -n --argjson expected "${EXPECTED}" \
                --argjson packages "$(cat packages.json)" \
                '[$packages[] | select(.repository == env.REPO) | select(.name as $n | ($expected | index($n)) | not)]' > orphans.json
          jq -r -n --argjson expected "${EXPECTED}" \
                --argjson packages "$(cat packages.json)" \
                '$packages[] | select(.repository == env.REPO) | select(.name as $n | ($expected | index($n))) | .name' | sort > live.txt
          {
            echo "### Package cleanup"
            echo
            echo "Probed $(jq 'length' <<< "${CANDIDATES}") package name(s) from this repository's history; found $(jq 'length' packages.json) package(s); the apps on this branch expect $(jq 'length' <<< "${EXPECTED}")."
            echo
            echo "#### Orphaned packages (no app in this repository anymore)"
            echo
            if [[ "$(jq 'length' orphans.json)" == "0" ]]; then
              echo "None."
            else
              echo "| Package | Versions | Link |"
              echo "| --- | --- | --- |"
              jq -r '.[] | "| \(.name) | \(.version_count) | [\(.html_url)](\(.html_url)) |"' orphans.json
            fi
            echo
            echo "#### Live packages (kept)"
            echo
            if [[ ! -s live.txt ]]; then
              echo "None."
            else
              sed 's/^/- /' live.txt
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the orphaned packages
        run: |
          count=$(jq 'length' orphans.json)
          if [[ "${DRY_RUN}" == "true" ]]; then
            jq -r '.[] | "Dry run: would delete \(.name) (\(.version_count) versions)"' orphans.json
            {
              echo
              echo "Dry run: ${count} orphaned package(s) would be deleted."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "${count}" == "0" ]]; then
            echo "No orphaned packages to delete."
            exit 0
          fi
          while read -r name; do
            encoded=$(jq -rn --arg n "${name}" '$n | @uri')
            echo "Deleting ${name} ..."
            gh api --silent --method DELETE "/user/packages/container/${encoded}"
          done < <(jq -r '.[].name' orphans.json)
          {
            echo
            echo "Deleted ${count} orphaned package(s):"
            jq -r '.[] | "- \(.name)"' orphans.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prune old untagged versions of the live packages
        run: |
          if [[ "${PRUNE_UNTAGGED}" != "true" ]]; then
            echo "Pruning untagged versions is switched off."
            exit 0
          fi
          # Untagged = superseded re-pushes: every release tag, latest and the
          # cosign sha256-* signature tags carry tags and are always kept.
          cutoff=$(date -u -d "30 days ago" +%s)
          : > untagged.tsv
          while read -r name; do
            encoded=$(jq -rn --arg n "${name}" '$n | @uri')
            gh api --paginate --slurp "/user/packages/container/${encoded}/versions?per_page=100" \
              | jq -r --arg name "${name}" \
                  '.[][] | select((.metadata.container.tags // []) | length == 0) | [$name, (.id | tostring), (.created_at | fromdateiso8601 | tostring)] | @tsv' >> untagged.tsv
          done < live.txt
          candidates=$(wc -l < untagged.tsv)
          if [[ "${candidates}" == "0" ]]; then
            echo "No untagged versions in the live packages."
            exit 0
          fi
          pruned=0
          skipped=0
          while IFS=$'\t' read -r name id created; do
            if (( created < cutoff )); then
              if [[ "${DRY_RUN}" == "true" ]]; then
                echo "Dry run: would delete untagged version ${id} of ${name} (created $(date -u -d "@${created}" +%Y-%m-%d))"
              else
                encoded=$(jq -rn --arg n "${name}" '$n | @uri')
                gh api --silent --method DELETE "/user/packages/container/${encoded}/versions/${id}"
                echo "Deleted untagged version ${id} of ${name} (created $(date -u -d "@${created}" +%Y-%m-%d))"
              fi
              pruned=$((pruned + 1))
            else
              skipped=$((skipped + 1))
            fi
          done < untagged.tsv
          if [[ "${DRY_RUN}" == "true" ]]; then word="would be deleted"; else word="deleted"; fi
          {
            echo
            echo "Untagged versions older than $(date -u -d "@${cutoff}" +%Y-%m-%d): ${pruned} ${word}, ${skipped} kept (younger than 30 days)."
          } >> "$GITHUB_STEP_SUMMARY"
