      - name: "Checkout, Setup Node.js: Setup Python ${{ inputs.python-version-fallback }} (fallback)"
        if: (('true') == 'true' && steps.setup-py.outcome != 'success')
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ ('3.14') }}
          cache: ${{ steps.snp-cfg.outputs.pip }}
          cache-dependency-path: pyproject.toml
      - name: "Checkout, Setup Node.js: Install Python dependencies"
        if: (('true') == 'true' && ('false') == 'true' && hashFiles('pyproject.toml') != '')
        shell: bash
        run: python -m pip install -e ".[dev]"

      - name: npm audit
        if: inputs.enable-npm-audit
        id: npm-audit
        shell: bash
        run: |
          echo "Running npm audit..."
          npm audit --audit-level=high --json > npm-audit.json 2>npm-audit.err || true
          if ! jq -e '.metadata.vulnerabilities' npm-audit.json >/dev/null 2>&1; then
            echo "::warning::npm audit did not produce a usable report"
            cat npm-audit.err
            echo "audit_ok=false" >> "$GITHUB_OUTPUT"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HIGH=$(jq -r '.metadata.vulnerabilities.high // 0' npm-audit.json)
          CRIT=$(jq -r '.metadata.vulnerabilities.critical // 0' npm-audit.json)
          echo "audit_ok=true" >> "$GITHUB_OUTPUT"
          echo "found=$([ $((HIGH + CRIT)) -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # pip-audit exits 1 both for findings and for "no supported project file",
      # so classify by whether it produced a parseable report, not by exit code.
      # Runs from a throwaway venv: system Python is PEP 668 managed.
      - name: pip-audit
        if: inputs.enable-pip-audit
        id: pip-audit
        shell: bash
        env:
          PIP_AUDIT_INPUTS: ${{ inputs.pip-audit-inputs }}
        run: |
          set -uo pipefail
          VENV="$RUNNER_TEMP/audit-venv"
          if python3 -m venv "$VENV" 2>/dev/null; then
            "$VENV/bin/pip" install --disable-pip-version-check -q pip-audit
            PIP_AUDIT="$VENV/bin/pip-audit"
          else
            python3 -m pip install --user --break-system-packages -q pip-audit
            PIP_AUDIT="python3 -m pip_audit"
          fi
          ARGS=()
          if [ -n "$PIP_AUDIT_INPUTS" ]; then ARGS+=(-r "$PIP_AUDIT_INPUTS"); fi
          $PIP_AUDIT --progress-spinner=off --format=json "${ARGS[@]}" > pip-audit.json 2>pip-audit.err
          rc=$?
          if ! jq -e '.dependencies' pip-audit.json >/dev/null 2>&1; then
            echo "::warning::pip-audit did not run (exit $rc)"
            cat pip-audit.err
            echo "audit_ok=false" >> "$GITHUB_OUTPUT"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "audit_ok=true" >> "$GITHUB_OUTPUT"
          echo "found=$(jq -r '[.dependencies[].vulns[]?] | length > 0' pip-audit.json)" >> "$GITHUB_OUTPUT"

      - name: Report audit result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NPM_RAN: ${{ inputs.enable-npm-audit }}
          PIP_RAN: ${{ inputs.enable-pip-audit }}
          NPM_OK: ${{ steps.npm-audit.outputs.audit_ok }}
          PIP_OK: ${{ steps.pip-audit.outputs.audit_ok }}
          NPM_FOUND: ${{ steps.npm-audit.outputs.found }}
          PIP_FOUND: ${{ steps.pip-audit.outputs.found }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const MARKER = '<!-- dependency-audit -->';
            const LEGACY_TITLE = 'Dependency vulnerabilities detected';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const env = process.env;
            const npmRan = env.NPM_RAN === 'true';
            const pipRan = env.PIP_RAN === 'true';
            const npmOk = !npmRan || env.NPM_OK === 'true';
            const pipOk = !pipRan || env.PIP_OK === 'true';
            const found = env.NPM_FOUND === 'true' || env.PIP_FOUND === 'true';
            const readJson = (f) => JSON.parse(fs.readFileSync(f, 'utf8'));
            const esc = (v) => String(v ?? '').replace(/\|/g, '\\|').replace(/\r?\n/g, ' ');

            const summary = core.summary.addHeading('Dependency audit', 2);
            summary.addList([
              `npm audit: ${npmRan ? (npmOk ? (env.NPM_FOUND === 'true' ? 'findings' : 'clean') : 'did not run') : 'disabled'}`,
              `pip-audit: ${pipRan ? (pipOk ? (env.PIP_FOUND === 'true' ? 'findings' : 'clean') : 'did not run') : 'disabled'}`,
            ]).addLink('Run', runUrl);

            // Open issues carrying our marker, or the legacy title from the old reporter.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'security,dependencies', per_page: 100,
            });
            const existing = open.filter((i) => !i.pull_request &&
              ((i.body || '').includes(MARKER) || i.title === LEGACY_TITLE));

            if (found) {
              let body = `${MARKER}\nHigh or critical vulnerabilities were found.\n\nRun: ${runUrl}\n`;
              if (env.NPM_FOUND === 'true') {
                const d = readJson('npm-audit.json');
                const rows = Object.values(d.vulnerabilities || {})
                  .filter((v) => ['high', 'critical'].includes(v.severity))
                  .map((v) => {
                    const adv = (v.via || []).filter((x) => typeof x === 'object')
                      .map((x) => `[${esc(x.title)}](${x.url})`).join('<br>') || 'transitive';
                    const fix = v.fixAvailable === true ? 'yes'
                      : v.fixAvailable ? esc(`${v.fixAvailable.name}@${v.fixAvailable.version}`) : 'none';
                    return `| ${esc(v.name)} | ${esc(v.range)} | ${adv} | ${v.severity} | ${fix} |`;
                  });
                body += `\n### npm audit\n\n| package | affected range | advisory | severity | fix |\n|---|---|---|---|---|\n${rows.join('\n')}\n`;
              }
              if (env.PIP_FOUND === 'true') {
                const d = readJson('pip-audit.json');
                const rows = [];
                for (const dep of d.dependencies) {
                  for (const v of dep.vulns || []) {
                    rows.push(`| ${esc(dep.name)} | ${esc(dep.version)} | ${esc(v.id)} | ${esc((v.fix_versions || []).join(', ') || 'none')} |`);
                  }
                }
                body += `\n### pip-audit\n\n| package | installed | advisory | fixed in |\n|---|---|---|---|\n${rows.join('\n')}\n`;
              }
              if (existing.length) {
                await github.rest.issues.update({ owner, repo, issue_number: existing[0].number, body });
                core.info(`Updated #${existing[0].number}`);
              } else {
                const { data } = await github.rest.issues.create({
                  owner, repo, title: LEGACY_TITLE, body, labels: ['security', 'dependencies'],
                });
                core.info(`Opened #${data.number}`);
              }
            } else if (npmOk && pipOk) {
              for (const i of existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: i.number,
                  body: `Audit is clean as of ${runUrl}; reopening automatically if findings return.`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: i.number, state: 'closed', state_reason: 'completed',
                });
                core.info(`Closed #${i.number}`);
              }
            } else {
              core.warning('Audit tool did not run; leaving existing issues untouched.');
            }
            await summary.write();

      - name: Audit tooling health
        if: steps.npm-audit.outputs.audit_ok == 'false' || steps.pip-audit.outputs.audit_ok == 'false'
        shell: bash
        run: |
          echo "::error::Dependency audit could not run; see warnings above."
          exit 1

  gap-linting:
    if: inputs.enable-gap-linting && needs.runners.outputs.dependabot == ''
    needs: runners
    runs-on: ${{ fromJSON(inputs.hosted-aux-jobs && '["ubuntu-latest"]' || needs.runners.outputs.linux-runner) }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: "Prepare runner: Clean workspace"
        if: (runner.environment == 'self-hosted' && runner.os == 'Linux')
        shell: bash
        run: |
          # Remove leftover files not owned by the runner user (e.g. root-owned
          # files left by a cancelled Docker step). Keeps the checked-out tree so
          # downstream local actions still resolve. sudo -n: never wait for a password.
          if [ -z "${GITHUB_WORKSPACE:-}" ] || [ "$GITHUB_WORKSPACE" = "/" ]; then
            echo "::warning::GITHUB_WORKSPACE is unset or '/', skipping workspace cleanup."
            exit 0
          fi
          sudo -n find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 3 ! -user "$(id -u -n)" -ignore_readdir_race -exec rm -rf -- {} + ||
            echo "::warning::Workspace cleanup failed (passwordless sudo missing?); a later checkout may hit root-owned files."
      - name: "Prepare runner: Check required tools"
        env:
          REQUIRED_TOOLS: ${{ ('jq') }}
        shell: bash
        run: |
          EXTRA_PATHS="/usr/local/bin /snap/bin /opt/microsoft/powershell/7 /opt/runner-tools/bin"
          MISSING=""
          for t in $REQUIRED_TOOLS; do
            command -v "$t" >/dev/null 2>&1 && continue
            for p in $EXTRA_PATHS; do
              [ -x "$p/$t" ] && continue 2
            done
            MISSING="$MISSING $t"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required tools on runner:${MISSING}. Install them or ensure they are in PATH."
            exit 1
          fi
          echo "All required tools present: $REQUIRED_TOOLS"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # codespell and checkov below are Python CLIs. The self-hosted runner has no
      # system-wide `pip`, so setup-python has to run first or both steps die with
      # `pip: command not found`. Pinned, not ./ for the same reason as the lint job:
      # this job runs on pull_request.
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: ""

      # Every linter config is optional. A repo without its own file under
      # .github/linters/ gets the platform default written below (the same
      # baseline scripts uses), outside the workspace so the scan stays clean.
      - name: Resolve linter configs
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          defaults="$RUNNER_TEMP/linter-defaults"
          mkdir -p "$defaults"
          cat > "$defaults/.codespellrc" <<'CFG'
          [codespell]
          skip = .git,node_modules,package-lock.json,*.lock,.venv,.terraform,dist,.output,.nuxt,**/dist,**/obj,**/terraform.tfstate*,*.min.js,*.svg
          quiet-level = 2
          CFG
          cat > "$defaults/.markdownlint.json" <<'CFG'
          { "default": true, "MD013": false, "MD024": { "siblings_only": true }, "MD033": false, "MD041": false }
          CFG
          cat > "$defaults/.jscpd.json" <<'CFG'
          { "threshold": 50, "minLines": 10, "minTokens": 50, "ignoreCase": true, "gitignore": true, "reporters": ["console"],
            "ignore": ["node_modules/**", ".git/**", "**/*.md", "**/*.json", "**/*.lock", "**/package-lock.json", "**/dist/**", "**/.output/**", "**/.nuxt/**"] }
          CFG
          cat > "$defaults/.checkov.yaml" <<'CFG'
          compact: true
          skip-framework:
            - secrets
          # CKV_GHA_7: workflow_dispatch inputs (release bump choices) are intended.
          skip-check:
            - CKV_GHA_7
          skip-path:
            - .venv
            - node_modules
            - .terraform
          CFG
          pick() { if [ -f "$2" ]; then echo "$1=$2"; else echo "$1=$defaults/$(basename "$2")"; fi; }
          opt() { if [ -f "$2" ]; then echo "$1=$2"; else echo "$1="; fi; }
          {
            opt constraints .github/ci/requirements.txt
            pick codespell .github/linters/.codespellrc
            pick markdownlint .github/linters/.markdownlint.json
            opt nvmrc .nvmrc
            pick jscpd .github/linters/.jscpd.json
            pick checkov .github/linters/.checkov.yaml
          } >> "$GITHUB_OUTPUT"

      # Same scope rule as the lint job's test scoping: on a PR (or a PR branch
      # the queue dispatches) codespell reads only the changed files and Checkov
      # runs only when an IaC-shaped file changed. Schedule and dispatch on the
      # base branch scan the whole tree.
      - name: Scope to changed files
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          QUEUE_BASE: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -uo pipefail
          range=""
          if [ "$EVENT_NAME" = "pull_request" ] && git rev-parse -q --verify "origin/${BASE_REF}" >/dev/null; then
            range="origin/${BASE_REF}...HEAD"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/$QUEUE_BASE" ] \
            && git rev-parse -q --verify "origin/$QUEUE_BASE" >/dev/null; then
            range="origin/$QUEUE_BASE...HEAD"
          fi
          list="$RUNNER_TEMP/gap-changed-files.txt"
          if [ -z "$range" ] || ! git diff --name-only --diff-filter=d "$range" > "$list"; then
            echo "full scan: no comparable base"
            { echo "files="; echo "checkov=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "files=$list" >> "$GITHUB_OUTPUT"
          # Checkov frameworks here: terraform, github_actions, kubernetes, ansible,
          # cloudformation/arm/bicep (yaml/json), dockerfile; plus its own config.
          if grep -qiE '\.(tf|tf\.json|hcl|ya?ml|json|bicep)$|(^|/)(Docker|Container)file|^\.github/linters/\.checkov' "$list"; then
            echo "checkov=true" >> "$GITHUB_OUTPUT"
          else
            echo "checkov=false" >> "$GITHUB_OUTPUT"
          fi
          echo "$(wc -l < "$list") changed file(s) in $range"

      - name: Codespell
        shell: bash
        env:
          CONSTRAINTS: ${{ steps.cfg.outputs.constraints }}
          CODESPELL_CFG: ${{ steps.cfg.outputs.codespell }}
          CHANGED: ${{ steps.scope.outputs.files }}
        run: |
          python -m pip install ${CONSTRAINTS:+-c "$CONSTRAINTS"} codespell
          if [ -z "$CHANGED" ]; then
            codespell ${CODESPELL_CFG:+--config "$CODESPELL_CFG"} .
          elif [ -s "$CHANGED" ]; then
            # codespell still applies the config's skip globs to named files.
            tr '\n' '\0' < "$CHANGED" | xargs -0 codespell ${CODESPELL_CFG:+--config "$CODESPELL_CFG"} --
          else
            echo "no changed files to spell-check"
          fi

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          config: ${{ steps.cfg.outputs.markdownlint }}
          globs: |
            *.md
            .github/**/*.md

      - name: Setup Node.js
        if: always()
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ steps.cfg.outputs.nvmrc }}
          node-version: ${{ steps.cfg.outputs.nvmrc == '' && inputs.node-version || '' }}

      - name: jscpd (copy/paste detection)
        if: always()
        shell: bash
        env:
          JSCPD_CFG: ${{ steps.cfg.outputs.jscpd }}
        run: npx --yes jscpd@5.4.2 ${JSCPD_CFG:+--config "$JSCPD_CFG"} .

      - name: Checkov (IaC security)
        if: always() && steps.scope.outputs.checkov != 'false'
        shell: bash
        env:
          CONSTRAINTS: ${{ steps.cfg.outputs.constraints }}
          CHECKOV_CFG: ${{ steps.cfg.outputs.checkov }}
        run: |
          python -m pip install ${CONSTRAINTS:+-c "$CONSTRAINTS"} checkov
          checkov -d . ${CHECKOV_CFG:+--config-file "$CHECKOV_CFG"}
      - name: "Clean gap-linting leftovers: Clean workspace"
        if: (always() && github.event_name != 'pull_request') && (runner.environment == 'self-hosted' && runner.os == 'Linux')
        shell: bash
        run: |
          # Remove leftover files not owned by the runner user (e.g. root-owned
          # files left by a cancelled Docker step). Keeps the checked-out tree so
          # downstream local actions still resolve. sudo -n: never wait for a password.
          if [ -z "${GITHUB_WORKSPACE:-}" ] || [ "$GITHUB_WORKSPACE" = "/" ]; then
            echo "::warning::GITHUB_WORKSPACE is unset or '/', skipping workspace cleanup."
            exit 0
          fi
          sudo -n find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 3 ! -user "$(id -u -n)" -ignore_readdir_race -exec rm -rf -- {} + ||
            echo "::warning::Workspace cleanup failed (passwordless sudo missing?); a later checkout may hit root-owned files."

  terraform:
    if: inputs.enable-terraform
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.linux-runner) }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read Terraform version
        id: tf-version
        shell: bash
        run: |
          # Optional: without .terraform-version, setup-terraform installs the latest.
          version=""
          if [ -f .terraform-version ]; then version=$(tr -d '[:space:]' < .terraform-version); fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}

      # Formatting is advisory and trivially auto-fixable, so it must not stop the
      # validate pass below from reporting real breakage.
      - name: Terraform fmt
        continue-on-error: true
        shell: bash
        run: terraform fmt -check -recursive .

      # -lockfile=readonly is the whole point: init resolves the providers a module
      # declares and fails if .terraform.lock.hcl does not already satisfy those
      # constraints, without writing anything back. That surfaces stale locks as
      # failures instead of silently repairing them, so `terraform plan` output a
      # developer sees locally matches what CI saw.
      #
      # A GitHub-hosted runner only has ~14 GB of disk and this loop visits all 35
      # modules, so the footprint has to be bounded: TF_PLUGIN_CACHE_DIR makes each
      # unique provider package download once per run instead of once per module,
      # and dropping .terraform/ after every module keeps peak usage at a single
      # module's extracted providers. Without both, the AWS provider alone (~1.7 GB
      # extracted) filled the disk after a handful of modules and the leftover
      # half-written packages surfaced as bogus "cached package does not match any
      # of the checksums" errors.
      - name: Terraform validate
        shell: bash
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugin-cache
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          REF: ${{ github.ref }}
          QUEUE_BASE: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -uo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"

          # PR, or a PR branch dispatched by the PR queue: modules changed vs the
          # base branch. Push: vs the previous tip. Schedule, dispatch on the base
          # branch (or an unusable base, e.g. a new branch): every module.
          range=""
          if [ "$EVENT_NAME" = "pull_request" ] && git rev-parse -q --verify "origin/${BASE_REF}" >/dev/null; then
            range="origin/${BASE_REF}...HEAD"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/$QUEUE_BASE" ] \
            && git rev-parse -q --verify "origin/$QUEUE_BASE" >/dev/null; then
            range="origin/$QUEUE_BASE...HEAD"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "${BEFORE_SHA//0/}" != "" ] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            range="${BEFORE_SHA}...HEAD"
          fi

          all_modules=$(find . -name versions.tf -not -path '*/.terraform/*' -exec dirname {} \; | sed 's#^\./##' | sort)
          if [ -z "$range" ]; then
            modules="$all_modules"
            echo "scope: all modules"
          else
            modules=$(git diff --name-only "$range" -- '*.tf' '*.tf.json' '*.terraform.lock.hcl' '.terraform-version' |
              while IFS= read -r file; do
                [ "$file" = ".terraform-version" ] && { printf '%s\n' "$all_modules"; continue; }
                dir=$(dirname "$file")
                # nearest ancestor that is a module root
                while [ "$dir" != "." ] && ! printf '%s\n' "$all_modules" | grep -qxF "$dir"; do dir=$(dirname "$dir"); done
                printf '%s\n' "$all_modules" | grep -xF "$dir" || true
              done | sort -u)
            echo "scope: modules changed in $range"
          fi

          # Registry downloads fail transiently; retry init before calling it a failure.
          init_module() {
            local module=$1 attempt delay
            for attempt in 1 2 3; do
              terraform -chdir="$module" init -backend=false -input=false -lockfile=readonly >/dev/null && return 0
              [ "$attempt" -lt 3 ] || break
              delay=$([ "$attempt" -eq 1 ] && echo 5 || echo 15)
              echo "init failed for $module (attempt $attempt/3), retrying in ${delay}s"
              sleep "$delay"
            done
            return 1
          }

          failures=0
          total=0
          while IFS= read -r module; do
            [ -n "$module" ] && [ -d "$module" ] || continue
            total=$((total + 1))
            if ! init_module "$module"; then
              printf '::warning file=%s::lock file does not satisfy required_providers\n' "$module/versions.tf"
              terraform -chdir="$module" init -backend=false -input=false -lockfile=readonly || true
              failures=$((failures + 1))
              rm -rf "$module/.terraform"
              continue
            fi
            terraform -chdir="$module" validate || failures=$((failures + 1))
            rm -rf "$module/.terraform"
          done <<< "$modules"
          printf 'checked %s module(s), %s failing\n' "$total" "$failures"
          exit "$failures"
