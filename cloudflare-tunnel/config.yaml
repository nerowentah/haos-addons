name: "Cloudflare Tunnel"
version: "0.3.5"
slug: "cloudflare_tunnel"
description: >-
  Connect Home Assistant to the Internet through a Cloudflare Tunnel without
  opening any port. Sign in to Cloudflare from the panel and the app creates
  the tunnel, its DNS record and the Home Assistant proxy settings (or paste
  a Zero Trust tunnel token), then keeps the connector running with status
  and failure notifications.
url: "https://github.com/nerowentah/haos-addons/tree/main/cloudflare-tunnel"
image: "ghcr.io/nerowentah/cloudflare-tunnel"
arch:
  - aarch64
  - amd64
startup: services
init: false
ingress: true
panel_icon: mdi:cloud-lock
panel_title: Cloudflare Tunnel
homeassistant_api: true
hassio_api: true
map:
  - type: homeassistant_config
    read_only: false
  - type: ssl
    read_only: false
options:
  tunnel_token: ""
  external_hostname: ""
  notify_on_failure: true
  run_parameters: []
  origin_tls: auto
  log_level: info
schema:
  tunnel_token: password?
  external_hostname: str?
  notify_on_failure: bool
  run_parameters:
    - match(^\s*((--edge-bind-address|--edge-ip-version|--grace-period|--ha-connections|--protocol|--region|--retries|--tag)=.+)?\s*$)?
  origin_tls: list(auto|verify|skip)?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
