name: "LG webOS DevMode Mgmt"
version: "1.7.2"
slug: "lg_webos_auto_renew"
description: >-
  Periodically renews LG webOS Developer Mode sessions before they expire by
  calling the LG Developer API, keeping Home Assistant integrations
  (LG ThinQ, webostv, etc.) connected without manual re-login.
url: "https://github.com/nerowentah/haos-addons/tree/main/lg-webos-devmode-mgmt"
image: "ghcr.io/nerowentah/lg-webos-auto-renew"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:television-play
panel_title: LG DevMode
panel_admin: true
homeassistant_api: true
hassio_api: true
options:
  interval_hours: 48
  retries: 3
  notify_on_failure: true
  sessions:
    - name: "living-room-tv"
      token: "YOUR_DEV_MODE_SESSION_TOKEN"
      enabled: true
schema:
  interval_hours: int(1,168)
  retries: int(0,10)
  notify_on_failure: bool
  sessions:
    - name: str
      token: password?
      url: url?
      enabled: bool?