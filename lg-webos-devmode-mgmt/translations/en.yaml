configuration:
  log_level:
    name: Log level
    description: How much the app writes to its log - trace, debug, info (default), notice, warning, error or fatal. Use debug while troubleshooting, then set it back to info. Applies without a restart.
  interval_hours:
    name: Renewal interval (hours)
    description: How often to renew the TV dev-mode sessions. Sessions last up to 1000 hours on current TVs and about 50 on older firmware; the default of 48 suits both.
  retries:
    name: Retries
    description: Times to re-attempt a failed renewal before reporting a failure.
  maintenance_windows:
    name: LG maintenance windows
    description: "Times (Home Assistant's timezone) when the app never calls LG's developer site. One per line, e.g. daily 00:00-06:00, sun 01:00-05:00, mon-fri 23:00-02:00. A renewal due inside a window waits until it ends. Leave the list empty to renew at any time; maintenance pages and HTTP 503 are still detected and backed off."
  notify_on_failure:
    name: Notify on failure
    description: Send a push notification when a renewal fails. Phones are found automatically; switch individual phones on or off in the LG DevMode panel.
  sessions:
    name: Sessions
    description: One entry per LG TV whose Developer Mode session should be renewed.
    fields:
      name:
        name: TV name
        description: Friendly name identifying this TV.
      token:
        name: Dev-mode session token
        description: Session token from the TV's Developer Mode app (or read over SSH). Masked in the UI.
      url:
        name: API URL (optional)
        description: Override the LG renewal endpoint; defaults to the built-in URL.
      enabled:
        name: Auto renew
        description: Switch off to pause scheduled renewals for this TV without deleting its token. Also switchable from the LG DevMode panel; applies without a restart.
      host:
        name: TV IP address (optional)
        description: Set it to let the app read the session token from the TV itself over SSH, the way ares-novacom does. Masked. Needs the passphrase below, and Key Server switched on once in the TV's Developer Mode app.
      port:
        name: TV SSH port (optional)
        description: SSH port of the TV in Developer Mode. Leave empty for 9922.
      passphrase:
        name: Passphrase
        description: Required when the TV IP address is set. The 6-character code shown in the TV's Developer Mode app; it unlocks the TV's SSH key. Masked.
      media_player:
        name: TV entity (optional)
        description: The TV's entity from the LG webOS TV integration, for example media_player.living_room_tv. The token is read from the TV each time this entity turns on. Without it the token is read before each scheduled renewal only.