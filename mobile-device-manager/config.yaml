name: "Mobile Device Manager"
version: "0.1.11"
slug: "mobile_device_manager"
description: >-
  Inventory and safe cleanup of Home Assistant Companion app devices: last
  seen, battery, stale and duplicate registrations, and every automation,
  script and notify call that still uses each phone, with one-click edit
  links and removal only when nothing depends on the device.
url: "https://github.com/nerowentah/haos-addons/tree/main/mobile-device-manager"
image: "ghcr.io/nerowentah/mobile-device-manager"
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:cellphone-cog
panel_title: Mobile Devices
homeassistant_api: true
hassio_api: true
options:
  scan_minutes: 30
  stale_days: 30
  notify_on_attention: true
  ignored_devices: []
  log_level: info
schema:
  scan_minutes: int(5,10080)
  stale_days: int(1,365)
  notify_on_attention: bool
  ignored_devices:
    - str
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
