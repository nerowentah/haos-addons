[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = [
  "E",
  "F",
  "W",    # pycodestyle + pyflakes
  "I",    # isort (import ordering)
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "S",    # flake8-security
  "SIM",  # flake8-simplify
  "PERF", # Perflint
  "PL",   # Pylint
  "RUF",  # Ruff-specific
  "ARG",  # flake8-unused-arguments
  "C4",   # flake8-comprehensions
  "RET",  # flake8-return
  "T20",  # flake8-print
  "TRY",  # tryceratops
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"lg-webos-devmode-mgmt/**/*.py" = [
  "TRY003",
]
"tnb-usage-checker/**/*.py" = [
  "TRY003",
]
"tnb-usage-checker/tests/*.py" = [
  "TRY003",
  "S105",
  "S106",
  "S101",
  "PLR2004",
  "PT009",
]
"mobile-device-manager/**/*.py" = [
  "TRY003",
]
"ranhill-saj-bill-checker/**/*.py" = [
  "TRY003",
]
"ranhill-saj-bill-checker/tests/*.py" = [
  "TRY003",
  "S101",
  "SLF001",
  "PLR2004",
  "PT009",
]
"api-key-manager/**/*.py" = [
  "TRY003",
]
"api-key-manager/tests/*.py" = [
  "TRY003",
  "S101",
  "PLR2004",
  "PT009",
]
"cloudflare-tunnel/**/*.py" = [
  "TRY003",
]
"cloudflare-tunnel/tests/*.py" = [
  "TRY003",
  "S101",
  "SLF001",
  "PLR2004",
  "PT009",
]
"mobile-device-manager/tests/*.py" = [
  "TRY003",
  "S101",
  "PLR2004",
  "PT009",
]
