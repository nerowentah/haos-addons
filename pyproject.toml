[tool.mypy]
# Run once per app, because the apps use the same module names:
#   MYPYPATH=<app>/rootfs/app mypy <app>/rootfs/app <app>/tests
python_version = "3.13"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = [
  "E",
  "F",
  "W",    # pycodestyle + pyflakes
  "I",    # isort (import ordering)
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "S",    # flake8-security
  "SIM",  # flake8-simplify
  "PERF", # Perflint
  "PL",   # Pylint
  "RUF",  # Ruff-specific
  "ARG",  # flake8-unused-arguments
  "C4",   # flake8-comprehensions
  "RET",  # flake8-return
  "T20",  # flake8-print
  "TRY",  # tryceratops
  "ANN",  # flake8-annotations
  "BLE",  # flake8-blind-except
  "PGH003", # a "type: ignore" names its error code
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"shared/**/*.py" = [
  "TRY003",
]
"shared/tests/*.py" = [
  "TRY003",
  "S101",
  "SLF001",
  "PLR2004",
  "PT009",
]
"tools/*.py" = [
  "TRY003",
]
"lg-webos-devmode-mgmt/**/*.py" = [
  "TRY003",
]
"tnb-usage-checker/**/*.py" = [
  "TRY003",
]
"tnb-usage-checker/tests/*.py" = [
  "ANN",  # until this app is strictly typed
