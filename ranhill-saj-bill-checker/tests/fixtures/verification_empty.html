<!doctype html><html><body><main><div class="column main"><input name="form_key" type="hidden" value="TESTFORMKEY12345" /><div id="tabs">
    <ul id="tabs-nav">
        <li class="passed"><a href="/expresspayment/checkout/search"><span class="step">01</span><span class="text">Search Bill</span></a></li>
        <li class="active"><a href="/expresspayment/checkout/verification"><span class="step">02</span><span class="text">Verification</span></a></li>
        <li><a href="javascript:void(0)"><span class="step">03</span><span class="text">Payment</span></a></li>
    </ul> <!-- END tabs-nav -->
    <div id="tabs-content">
        <div id="tab2" class="tab-content">
            <form id="custom-form" method="post" action="/expresspayment/checkout/summary" class="digit-group" data-group-name="digits" data-autosubmit="false" autocomplete="off">
                <div class="group-content">
                    <div class="block column-left">
                        <h2>Verify Your Account</h2>
                        <div class="payment-infor">
                            <div class="payment-address">
                                <strong></strong>
                                <p class="address"></p>
                            </div>
                            <div class="payment-amount">
                                <p class="label">Amount Due</p>
                                <p class="amount"></p>
                            </div>
                        </div>

                        <div class="payment-like-to-pay">
                            <div class="payment-questions">
                                <h4>How much would you like to pay?</h4>
                                <small>The minimum payment of Quick Payment is RM10.00</small><br>
                            </div>
                            <div class="payment-amount">
                                <p class="label">Paying Amount (RM)&#42;</p>
                                <input type="hidden" id="greaterAmount" name="hiddenAmount" value="10" />
                                <input type="text" class="input-text paying-text required" data-validate="{number:true, 'greater-than-equals-to': '#greaterAmount'}" name="payment-amount" value="">
                            </div>
                        </div>
                    </div>
                    <div class="block column-right">
                        <h2>Send Receipt to</h2>
                        <div class="field email required">
                            <label class="label">Email Address</label>
                            <input type="text" value="" class="input-text" name="email" data-validate="{required:true, 'validate-email':true}" placeholder="ex: sam.noor@mymail.com">
                        </div>
                        <div class="field phone required">
                            <label class="label">Phone</label>
                            <input type="text" value="" class="input-text required" name="phone" placeholder="ex: 012-3456789">
                        </div>
                        <small class="form-note">Required fields</small>
                    </div>
                </div>
                <div class="text-center" style="margin: 20px 0;">
                    <small>By continuing, I agree to <a href="#" class="link bgcolor">PDPA</a> and Ranhill SAJ's <a href="/privacy-notice" class="link bgcolor">Terms and Conditions</a></small>
                </div>
                <div class="actions">
                    <div class="secondary">
                        <a href="/expresspayment/checkout/search" class="action secondary previous">
                            Previous
                        </a>
                    </div>

                    <div class="primary">
                        <button type="submit" class="action primary next">
                            Next
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div> <!-- END tabs-content -->
</div></div></main></body></html>
