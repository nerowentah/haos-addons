name: "Ranhill SAJ Bill Checker"
version: "0.2.7"
slug: "ranhill_saj_bill_checker"
description: >-
  Checks the amount due on one or more Ranhill SAJ (Johor) water accounts
  through the public Quick Payment page, with no login, and publishes it as
  Home Assistant sensors (MQTT devices when a broker is available).
url: "https://github.com/nerowentah/haos-addons/tree/main/ranhill-saj-bill-checker"
image: "ghcr.io/nerowentah/ranhill-saj-bill-checker"
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:water
panel_title: SAJ Water
homeassistant_api: true
hassio_api: true
services:
  - mqtt:want
options:
  notify_on_failure: true
  notify_on_unpaid: true
  mqtt: true
  accounts:
    - name: "Home"
      account_number: ""
  log_level: info
schema:
  notify_on_failure: bool
  notify_on_unpaid: bool?
  mqtt: bool
  accounts:
    - name: str
      account_number: match(^(\s*\d{8}[\s-]*[A-Za-z][\s-]*\d{7}\s*)?$)?
      enabled: bool?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
