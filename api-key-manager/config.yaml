name: "API Key Manager"
version: "0.1.1"
slug: "api_key_manager"
description: >-
  Every Home Assistant user's long-lived access tokens (API keys) in one
  place: description, owner, created, last used and from where, with
  automatic flags for unused, vague and admin keys and a review state and
  note for each one. Login sessions can be listed too. Read-only.
url: "https://github.com/nerowentah/haos-addons/tree/main/api-key-manager"
image: "ghcr.io/nerowentah/api-key-manager"
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:key-chain
panel_title: API Keys
homeassistant_api: true
hassio_api: true
map:
  - type: homeassistant_config
    read_only: true
options:
  unused_days: 90
  notify_on_new_keys: true
  vague_words: []
  log_level: info
schema:
  unused_days: int(7,3650)
  notify_on_new_keys: bool
  vague_words:
    - str
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
