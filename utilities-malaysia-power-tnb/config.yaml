name: "Power TNB"
version: "0.1.0"
slug: "power_tnb"
description: >-
  Tracks Malaysian TNB electricity for multiple accounts: imports hourly
  myTNB smart meter usage and cost into the Energy dashboard and estimates
  the running bill (2025 tariff, ToU, AFA, EEI, SST, KWTBB, NEM) from a local
  energy sensor, published as MQTT devices.
url: "https://github.com/nerowentah/haos-addons/tree/main/utilities-malaysia-power-tnb"
image: "ghcr.io/nerowentah/power-tnb"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:lightning-bolt
panel_title: Power TNB
homeassistant_api: true
hassio_api: true
services:
  - mqtt:need
options:
  portal_interval_hours: 6
  meter_poll_seconds: 60
  afa_rate: 0.0
  calendarific_api_key: ""
  extra_holidays: []
  notify_on_failure: true
  notification_overrides: []
  accounts:
    - name: "Home"
      tariff: "general"
      billing_start_day: 1
      import_entity: "sensor.grid_energy"
      enabled: true
      meter_enabled: true
schema:
  portal_interval_hours: int(1,24)
  meter_poll_seconds: int(10,600)
  afa_rate: float(-1,1)
  calendarific_api_key: password?
  extra_holidays:
    - match(^\d{4}-\d{2}-\d{2}$)
  notify_on_failure: bool
  notification_overrides:
    - name: str
      notify: bool
  accounts:
    - name: str
      tariff: list(general|tou)
      billing_start_day: int(1,31)
      mytnb_username: email?
      mytnb_password: password?
      smartmeter_url: url?
      import_entity: str?
      export_entity: str?
      enabled: bool?
      portal_enabled: bool?
      meter_enabled: bool?
      statistics_enabled: bool?
